# Runs on each push to a branch and on each pull request.
#
# - Not on a pushed tag: a tag names a commit that a branch's run has
#   tested, and the release workflow refuses a tag whose commit has no
#   successful run here (scripts/check-ci-passed.sh).
# - Not on a push to a dependabot/** branch: Dependabot opens a pull request
#   for each, and the pull request's run tests the same change.
# - A newer push to a branch cancels the run of the older one, except on
#   main, where every commit keeps its run and its binaries.
#
# The job keep keeps the release binary of each architecture for 7 days,
# smock-linux-amd64 and smock-linux-arm64, when every other job passed.
name: CI

on:
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:

permissions:
  contents: read

# One group for each branch or pull request, and one for each run on main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (pinned MoonBit)
    uses: ./.github/workflows/build-test.yml
    # What the called workflow's jobs may ask for at most; only its job plan
    # asks for actions: read.
    permissions:
      contents: read
      actions: read
    with:
      toolchain: pinned

  # The checks that need no build of smock: of the workflows, of the scripts
  # that other jobs run, of the documents, of committed files that are
  # generated, and of the Helm chart's rendering. Each step runs whatever
  # the steps before it found, so one run shows every failure.
  scripts:
    name: Checks of the workflows, scripts, documents and chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # --- The workflows ----------------------------------------------------

      - name: Check the release workflow
        run: scripts/check-release-workflow.sh

      - name: Test the release notes
        if: ${{ !cancelled() }}
        run: scripts/test-release-notes.sh

      # The release workflow's checks of a pushed tag: that CI passed on its
      # commit, and that it names the version in moon.mod.
      - name: Test the release workflow's checks of a tag
        if: ${{ !cancelled() }}
        run: scripts/test-release-gates.sh

      # The benchmark itself runs only by hand (benchmark.yml); this checks
      # its files. Its request mix and definitions are checked against smock
      # by the tests in e2e/bench_test.mbt.
      - name: Check the benchmark workflow
        if: ${{ !cancelled() }}
        run: scripts/check-benchmark-workflow.sh

      # The measurement of the tests' costs on CI's runners runs only by hand
      # (measure-costs.yml). This checks the workflow, and tests the check,
      # the measurement against a fake moon, and the recomputed cost model
      # on made-up numbers.
      - name: Check the measurement workflow
        if: ${{ !cancelled() }}
        run: scripts/check-measure-costs-workflow.sh

      - name: Test the check of the measurement workflow
        if: ${{ !cancelled() }}
        run: scripts/test-check-measure-costs-workflow.sh

      - name: Test the measurement against a fake moon
        if: ${{ !cancelled() }}
        run: scripts/test-measure-costs.sh

      - name: Test the recomputed cost model
        if: ${{ !cancelled() }}
        run: scripts/test-estimate-costs.sh

      # The e2e tests run again and again only by hand (e2e-repeat.yml).
      # This checks when that workflow runs and how it runs the tests, and
      # tests the script that repeats them, with a fake moon.
      - name: Check the e2e repeat workflow
        if: ${{ !cancelled() }}
        run: scripts/check-e2e-repeat-workflow.sh

      - name: Test the check of the e2e repeat workflow
        if: ${{ !cancelled() }}
        run: scripts/test-check-e2e-repeat-workflow.sh

      - name: Test the script that repeats the e2e tests
        if: ${{ !cancelled() }}
        run: scripts/test-repeat-e2e.sh

      # The check of the Unicode data against its generator downloads the
      # Unicode Character Database, so it runs in unicode-data.yml, when the
      # table, the generator or that workflow changes and once a week, and
      # not here; this checks when that workflow runs and what it runs.
      - name: Check the Unicode data workflow
        if: ${{ !cancelled() }}
        run: scripts/check-unicode-data-workflow.sh

      - name: Test the check of the Unicode data workflow
        if: ${{ !cancelled() }}
        run: scripts/test-check-unicode-data-workflow.sh

      # The GKE run of the benchmark of another architecture than its
      # machine's takes the release binary that the job keep below keeps.
      # This checks the conditions under which the jobs of build-test.yml
      # run and the binaries are kept.
      - name: Check that the release binaries are kept only when every job passed
        if: ${{ !cancelled() }}
        run: scripts/check-ci-artifacts.sh

      - name: Test that check
        if: ${{ !cancelled() }}
        run: scripts/test-check-ci-artifacts.sh

      # What decides that a run may skip jobs: build-test.yml's plan on main
      # (scripts/ci-plan.sh) and the weekly run's
      # (scripts/latest-toolchain-plan.sh).
      - name: Test the plan that skips tests of a tree that already passed
        if: ${{ !cancelled() }}
        run: scripts/test-ci-plan.sh

      - name: Test the plan of the weekly run with the latest MoonBit
        if: ${{ !cancelled() }}
        run: scripts/test-latest-toolchain-plan.sh

      # The branch checks run on a push to a branch other than main, in
      # branch-checks.yml and not here, so that keep never waits for them.
      # This checks when that workflow runs and what it runs, and tests the
      # weakening report it writes, on small git histories.
      - name: Check the branch checks workflow
        if: ${{ !cancelled() }}
        run: scripts/check-branch-checks-workflow.sh

      - name: Test the check of the branch checks workflow
        if: ${{ !cancelled() }}
        run: scripts/test-check-branch-checks-workflow.sh

      - name: Test the weakening report
        if: ${{ !cancelled() }}
        run: scripts/test-weakening-report.sh

      # --- The scripts that build-test.yml runs --------------------------------

      # build-test.yml makes and checks the SBOM of the image it builds.
      # This tests the scripts that do so on small SBOMs, also where the
      # SBOM and NOTICE disagree.
      - name: Test the SBOM scripts
        if: ${{ !cancelled() }}
        run: scripts/test-sbom.sh

      # build-test.yml runs h2spec against smock and judges its report with
      # scripts/h2spec-verdict.py. This tests the verdict on small reports.
      - name: Test the h2spec verdict
        if: ${{ !cancelled() }}
        run: scripts/test-h2spec-verdict.sh

      # The job yaml-test-suite below judges the answers of smock's YAML
      # parser with scripts/yaml-test-suite-verdict.py. This tests the
      # verdict on small made-up suites.
      - name: Test the yaml-test-suite verdict
        if: ${{ !cancelled() }}
        run: scripts/test-yaml-test-suite-verdict.sh

      # build-test.yml cross-checks the JSON Schema with smock on every
      # fixture (scripts/check-schema.sh). This tests that check with a
      # validator and a smock that answer as the test tells them.
      - name: Test the cross-check of the JSON Schema
        if: ${{ !cancelled() }}
        run: scripts/test-check-schema.sh

      # --- The tools that judge the tests -----------------------------------

      # scripts/coverage.sh runs the in-process tests under coverage and
      # reports each package's points from the toolchain's bisect report
      # (scripts/coverage-report.py). This tests the report on small
      # committed bisect reports, a partly covered line among them.
      - name: Test the coverage report
        if: ${{ !cancelled() }}
        run: scripts/test-coverage-report.sh

      # --- The documents ----------------------------------------------------

      # The documents link to each other by path and by the anchors that
      # GitHub makes of their headings, and a heading that gets another
      # name breaks the links to it with no other sign. This checks every
      # link from a Markdown file into the repository
      # (scripts/check-doc-links.py), without the network, and tests the
      # check on small trees.
      - name: Check the documents' links
        if: ${{ !cancelled() }}
        run: python3 scripts/check-doc-links.py

      - name: Test the check of the documents' links
        if: ${{ !cancelled() }}
        run: scripts/test-check-doc-links.sh

      # The contract tests in e2e/ check smock's responses against the
      # document; this checks the document itself.
      - name: Check that the Admin API document is valid OpenAPI
        if: ${{ !cancelled() }}
        run: scripts/check-openapi.sh

      # --- Committed files that are generated -------------------------------

      - name: Check the benchmark's definitions against their generator
        if: ${{ !cancelled() }}
        run: python3 bench/gen_definitions.py --check

      # The Descriptor sets and protobuf messages that tests read are
      # committed beside their .proto sources (fixtures/protobuf/README.md).
      # This rebuilds every file that scripts/gen-protobuf-fixtures.sh
      # writes, with the pinned protoc, and fails on any difference, naming
      # each file that differs. A fixture added to the script is checked
      # with no change here.
      - name: Install protoc
        if: ${{ !cancelled() }}
        run: scripts/install-protoc.sh "$RUNNER_TEMP/protoc"

      - name: Rebuild the protobuf fixtures and compare them with the committed ones
        if: ${{ !cancelled() }}
        run: scripts/gen-protobuf-fixtures.sh --check

      - name: Test the check of the protobuf fixtures
        if: ${{ !cancelled() }}
        run: scripts/test-protobuf-fixtures.sh

      # --- The benchmark's comparison ---------------------------------------

      # The comparison that the merge checklist reads
      # (docs/merging-into-main.md). The tests of scripts/gke-bench.sh run
      # when it or bench/ changes (bench-tests.yml).
      - name: Test the benchmark comparison
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s bench -p test_compare.py -v

      # --- The keep list ----------------------------------------------------

      # mutation/kept-tests.toml names the tests that removal rule (C) keeps
      # for a reason the kill matrix cannot see. This checks that each test
      # it names is still there (scripts/check-kept-tests.py), so that a
      # listed test cannot vanish unnoticed, and tests that check on small
      # trees.
      - name: Check that every test on the keep list is still there
        if: ${{ !cancelled() }}
        run: python3 scripts/check-kept-tests.py

      - name: Test the check of the keep list
        if: ${{ !cancelled() }}
        run: scripts/test-check-kept-tests.sh

      # --- The removal proof -------------------------------------------------

      # A test may be removed only when, among other sets, its removal keeps
      # the trace links: from the commit that introduced each test, through
      # moves and copies, to the ticket that commit names and that issue's
      # acceptance criteria (scripts/trace-links.py). This tests them on
      # small git histories, with a stand-in for gh.
      - name: Test the trace links
        if: ${{ !cancelled() }}
        run: scripts/test-trace-links.sh

      # --- The Helm chart ---------------------------------------------------

      # The chart on a cluster is tested in build-test.yml, with the image
      # built there.
      - name: Install helm
        if: ${{ !cancelled() }}
        run: scripts/install-kubernetes-tools.sh "$RUNNER_TEMP/bin" helm

      - name: Lint the chart
        if: ${{ !cancelled() }}
        run: helm lint --strict charts/smock --set adminAuth.tokenSecret.name=smock-admin-token

      - name: Render the chart for each delivery mode and option and check it
        if: ${{ !cancelled() }}
        run: scripts/test-helm-chart.sh

  # yaml-test-suite against smock's YAML parser, smock/yaml, in both of its
  # modes (yaml-test-suite/README.md): scripts/check-yaml-test-suite.sh
  # fetches the pinned release of the suite, checked against its SHA-256,
  # builds the testee with moon, and judges every case in each mode against
  # the mode's list of the cases that do not pass, yaml-test-suite/safe.txt
  # and yaml-test-suite/openapi.txt. It runs beside the other jobs, so that
  # it adds nothing to the run's wall time, and keep waits for it.
  yaml-test-suite:
    name: yaml-test-suite against smock/yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit (pinned)
        run: scripts/install-moonbit.sh pinned

      - name: Update the mooncakes registry index
        run: moon update

      - name: Run yaml-test-suite against smock/yaml in both modes
        run: scripts/check-yaml-test-suite.sh

  # Keeps the release binary of each architecture for a machine that cannot
  # build it: the GKE benchmark of amd64 from an arm64 machine takes it
  # (scripts/gke-bench.sh --arch amd64 --smock). It runs after every other
  # job, and only when each of them passed, so a kept binary comes from a
  # run whose every check passed. Where build-test.yml skipped the tests of
  # a tree that already passed (its job plan), the same tree passed them in
  # the merged branch's run. Each step renames what build-test.yml's job
  # release handed over, and removes the handed-over copy.
  keep:
    name: Keep the release binaries
    needs: [build-test, scripts, yaml-test-suite]
    if: ${{ !cancelled() && needs.build-test.result == 'success' && needs.scripts.result == 'success' && needs.yaml-test-suite.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Keep the amd64 binary as smock-linux-amd64
        uses: actions/upload-artifact/merge@v7
        with:
          name: smock-linux-amd64
          pattern: release-linux-amd64
          retention-days: 7
          delete-merged: true

      - name: Keep the arm64 binary as smock-linux-arm64
        uses: actions/upload-artifact/merge@v7
        with:
          name: smock-linux-arm64
          pattern: release-linux-arm64
          retention-days: 7
          delete-merged: true
