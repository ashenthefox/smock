# Builds and tests every module. ci.yml runs it with the pinned toolchain on
# each push and pull request; latest-toolchain.yml runs it weekly with the
# latest stable MoonBit. With the pinned toolchain, it keeps the release
# binary of each architecture as a workflow artifact for 7 days,
# smock-linux-amd64 and smock-linux-arm64; ci.yml's SDK job reads the amd64
# one's LLM responses with the official SDKs.
name: Build and test

on:
  workflow_call:
    inputs:
      toolchain:
        description: "pinned (the version in .moonbit-version) or latest (the latest stable MoonBit)"
        type: string
        default: pinned

permissions:
  contents: read

jobs:
  native:
    name: native (linux/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      SMOCK_VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      # The runner check, OpenSSL, MoonBit and moon update.
      - uses: ./.github/actions/native-setup
        with:
          machine: ${{ matrix.machine }}
          toolchain: ${{ inputs.toolchain }}

      - run: moon version --all

      # moon takes the version moon.mod gives an import as a minimum, so a
      # module that needs a later moonhttp would raise it. This fails on any
      # difference, which is what pins moonhttp exactly (ADR 0005).
      - name: Check that the build resolves the moonhttp that moon.mod names
        run: scripts/check-moonhttp-pin.sh

      - name: Check formatting
        if: inputs.toolchain == 'pinned'
        run: moon fmt --check

      - name: Check every target
        run: moon check --deny-warn --target all

      - name: Check that the protocol modules and the packages that decide a response do no I/O
        run: scripts/check-no-io.sh

      # It also scans the modules the build resolves outside moonbitlang,
      # which moon check downloaded: moonhttp and the modules it imports, so
      # that an upgrade brings no C (ADR 0005).
      - name: Check the C boundary (ADR 0001), in smock and in its resolved modules
        run: scripts/check-no-c.sh

      # NOTICE names every module the build resolves, of any owner and
      # transitive ones included, at the version the build resolves, and
      # says which of them smock compiles nothing from (ADR 0005). The
      # release workflow runs the same check.
      - name: Check that NOTICE names the toolchain and every module the build resolves
        run: scripts/check-notice.sh

      - name: Test the moonhttp pin check, the C check of the resolved modules and the NOTICE check
        run: scripts/test-dependency-checks.sh

      - name: Test every module natively
        run: moon test --target native

      # A release build may fuse floating-point multiply-adds, so that a
      # seeded log-normal delay differs from the one wasm-gc draws.
      # prebuild.py turns that off, and the engine's tests check it.
      - name: Test the engine in a release build
        run: moon test --target native --release -p smock/smock/engine

      - name: Test the OpenSSL bindings under AddressSanitizer and LeakSanitizer
        run: scripts/test-openssl-asan.sh

      - name: Build the release binary
        run: scripts/build-release.sh

      - name: Check smock --version
        run: >-
          scripts/check-version.sh dist/smock
          "$SMOCK_VERSION"
          "${GITHUB_SHA::12}"
          "moonc $(moonc -v | cut -d' ' -f1)"

      # h2spec publishes a Linux binary for amd64 only, so it runs there.
      # Every case of its generic, http2 and hpack sections runs against
      # the plain port (h2c) and the TLS port (h2, by ALPN);
      # scripts/h2spec/plain.txt and tls.txt list the cases that do not pass
      # on each, with their reasons, and the log names a listed case that
      # passes, so that it can come off.
      - name: Install h2spec
        if: matrix.arch == 'amd64'
        run: scripts/install-h2spec.sh "$RUNNER_TEMP/bin"

      - name: Run h2spec against the plain port (h2c) and the TLS port (h2)
        if: matrix.arch == 'amd64'
        run: scripts/check-h2spec.sh dist/smock plain tls

      # grpcurl, a real gRPC client, pinned by version and SHA-256, calls
      # the release binary on the plain port (h2c) and on the TLS port (h2):
      # list and describe through reflection, calls with JSON and metadata,
      # the same calls with -protoset and no reflection, an error with
      # details through -format-error, and health checks. Each call's
      # expected output is in scripts/grpcurl/calls, and the gRPC guide
      # shows only those calls. Any difference fails the step and shows
      # what grpcurl printed.
      - name: Install grpcurl
        run: scripts/install-grpcurl.sh "$RUNNER_TEMP/bin"

      - name: Call smock with grpcurl on the plain port (h2c) and the TLS port (h2)
        run: scripts/check-grpcurl.sh dist/smock

      - name: Test that the grpcurl check fails on each difference
        run: scripts/test-check-grpcurl.sh dist/smock

      # The release workflow builds and smoke-tests the image the same way.
      - name: Build the container image
        run: docker build --provenance=false --tag smock:ci .

      - name: Smoke-test the container image
        run: >-
          scripts/smoke-test-image.sh smock:ci
          "$SMOCK_VERSION"
          "${GITHUB_SHA::12}"
          "moonc $(moonc -v | cut -d' ' -f1)"

      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      # The release workflow makes the published image's SBOM the same way,
      # but only for a tag: this checks on every push that smock, its
      # MoonBit modules, and the runtime, mimalloc and simdutf of the
      # toolchain get into it. The modules are every module the build
      # resolves, moonhttp and the modules it imports among them; they and
      # the last three must be as NOTICE names them.
      - name: Make the image's SBOM as the release workflow does
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          scripts/resolved-modules.sh --json >modules.json
          "$SYFT" scan docker:smock:ci --output spdx-json=sbom.spdx.json
          scripts/add-smock-to-sbom.sh sbom.spdx.json "$SMOCK_VERSION" "$GITHUB_SHA" modules.json
          jq -e --arg version "$SMOCK_VERSION" --slurpfile modules modules.json '
            [.packages[] | "\(.name)@\(.versionInfo)"] as $packages
            | ($packages | index("smock@\($version)")) != null
            and any(.packages[]; .name == "moonbitstack/moonhttp")
            and ([$modules[0][] | "\(.name)@\(.version)"] - $packages) == []' sbom.spdx.json
          scripts/check-sbom-notice.sh sbom.spdx.json

      - name: Install helm, kubectl and kind
        run: scripts/install-kubernetes-tools.sh "$RUNNER_TEMP/bin"

      # Installs the chart with this image into a namespace that enforces
      # the Restricted Pod Security Standard, and checks that a ConfigMap
      # update reaches smock without a restart.
      - name: Test the Helm chart on kind
        run: scripts/test-helm-chart-on-kind.sh smock:ci

      # An external JSON Schema validator and smock check must agree on
      # every Definition-file fixture under schema/v1/fixtures/.
      - name: Cross-check the JSON Schema with smock
        run: scripts/check-schema.sh dist/smock

      # The contract tests in e2e/ check smock's responses against the
      # document; this checks the document itself.
      - name: Check that the Admin API document is valid OpenAPI
        run: scripts/check-openapi.sh

      # The release binary that scripts/build-release.sh made above and the
      # image packs, kept once every check passed, for a machine that cannot
      # build one of this architecture: the GKE benchmark of amd64 from an
      # arm64 machine takes it (scripts/gke-bench.sh --arch amd64 --smock),
      # and so does ci.yml's SDK job, which builds nothing (llm-sdks/).
      # Its --version names this run's commit. scripts/check-ci-artifacts.sh
      # checks this step, and the SDK job.
      - name: Keep the release binary
        if: inputs.toolchain == 'pinned'
        uses: actions/upload-artifact@v7
        with:
          name: smock-linux-${{ matrix.arch }}
          path: dist/smock
          retention-days: 7
          if-no-files-found: error

  wasm-gc:
    name: wasm-gc (no-I/O packages)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit (${{ inputs.toolchain }})
        run: scripts/install-moonbit.sh "${{ inputs.toolchain }}"

      - name: Update the mooncakes registry index
        run: moon update

      # moon skips every package whose supported_targets leave out wasm-gc,
      # which is how packages that do I/O are marked. Every other package,
      # including each new no-I/O package, is tested here with no change.
      # scripts/check-no-io.sh keeps the packages that decide a response
      # from leaving wasm-gc out.
      - name: Test every no-I/O package on wasm-gc
        run: moon test --target wasm-gc

  # protobuf's conformance suite against smock/protobuf
  # (protobuf-conformance/README.md). protobuf publishes no runner, so
  # scripts/build-conformance-runner.sh builds conformance_test_runner from
  # the pinned protobuf release, and the build is cached until the script,
  # or the protoc it pins, changes. The runner drives the testee, which
  # scripts/check-conformance.sh builds with moon, and fails on a result
  # that differs from protobuf-conformance/failure_list.txt; the lists of
  # what differs are then kept.
  protobuf-conformance:
    name: protobuf's conformance suite (smock/protobuf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit (${{ inputs.toolchain }})
        run: scripts/install-moonbit.sh "${{ inputs.toolchain }}"

      - name: Update the mooncakes registry index
        run: moon update

      # The runner links the image's C++ library, so the cache is the
      # image's, by its ImageOS, such as ubuntu24.
      - name: Name the runner image
        id: image
        run: echo "os=$ImageOS" >>"$GITHUB_OUTPUT"

      - name: Restore protobuf's conformance runner
        id: runner
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/smock/conformance-runner
          key: conformance-runner-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-conformance-runner.sh', 'scripts/install-protoc.sh') }}

      - name: Build protobuf's conformance runner
        if: steps.runner.outputs.cache-hit != 'true'
        run: scripts/build-conformance-runner.sh ~/.cache/smock/conformance-runner

      # Saved as soon as it is built, so that a failing suite does not
      # build it again on the next run.
      - name: Cache protobuf's conformance runner
        if: steps.runner.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/smock/conformance-runner
          key: ${{ steps.runner.outputs.cache-primary-key }}

      - name: Run protobuf's conformance suite against smock/protobuf
        run: >-
          scripts/check-conformance.sh
          ~/.cache/smock/conformance-runner/conformance_test_runner
          "$RUNNER_TEMP/conformance"

      - name: Keep what differs from the failure list
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: protobuf-conformance
          path: ${{ runner.temp }}/conformance
          retention-days: 7
          if-no-files-found: ignore
