[[reason]]
id = 'spec-constant'
rule = 'spec constant'
title = 'A test of a constant that a spec fixes'
source = """
#275, The removal rule and its proof, (C): spec-constant tests. #275, Step
1: the tests that pin protocol constants (gRPC status codes 13 and 0, the
content type application/grpc) are kept as spec oracles. User stories 42 and
66. The maintainer's decision of 2026-11-17 on #351: a vendor's published
API reference counts as a spec, so the words that an LLM vendor's reference
fixes are spec constants too.
"""
search = [
  '''git grep -n -i -E '^(async )?test "([^"\\]|\\.)*(status codes?|code is|reason phrases?|content type (of|is)|reserves|reserved|numbers and names|wire types?|error codes?|is application/)' -- '*_test.mbt' '*_wbtest.mbt' '*.mbt.md'''',
  '''git grep -n -E '(inspect|assert_eq)\(\s*@[a-z0-9_]+\.[a-z_][a-z0-9_]*\s*(,|\))' -- '*_test.mbt' '*_wbtest.mbt' '*.mbt.md'''',
  '''git grep -n -i 'spec oracle' -- '*_test.mbt' '*_wbtest.mbt' '*.mbt.md'''',
  '''git grep -n -i -E '^(async )?test "([^"\\]|\\.)*(stop reasons?|incomplete reasons?|error types?|finish reasons?|documented)' -- '*_test.mbt' '*_wbtest.mbt' '*.mbt.md'''',
]
found = """
The first search, over test names, finds 21 tests; the second, a test that
inspects a package's constant itself, finds grpc's content type; the third
finds the doc comments of two of the tests below, which say "A spec oracle."
The fourth, over test names in the words of the LLM vendors' references,
finds 27 tests.

Listed: a test whose name says that its subject is a value a spec fixes, a
code, a name or a content type, and whose every expected value comes from
that spec. Left out: the tests whose subject is a rule of reading or writing
(a content subtype, the wire types of a tag, the reason phrase of an unknown
status, the names refused in a Definition file), whose mutants show their
worth; grpc/metadata_test.mbt's test of the names gRPC reserves, since
PROTOCOL-HTTP2 reserves only the names that start with grpc- ("Header names
starting with grpc- but not listed here are reserved for future GRPC use"),
and content-type and te come from smock's own reading; and the e2e tests
that see these values on the wire, which a removal batch judges.

Of the fourth search's 27, listed: the 4 tests of llm/checks_test.mbt whose
subject is a set of words that a vendor's API reference fixes, each word of
it accepted: Chat Completions' finish reasons, Responses' incomplete
reasons, Anthropic's stop reasons and Anthropic's error types. The words are
string literals of llm (llm/llm.mbt, stop_reasons and anthropic_error_types),
which is outside STR's scope, so no mutant of operator set v1 changes them
and the kill matrix cannot see what these tests check. Each also asserts
smock's own refusal of other words, whose message comes from smock's
documents, not from the reference: the rule above, that every expected value
comes from the spec, holds for the accepted words. Left out: the tests of
where smock writes a stop reason or derives one (14 tests of llm and
engine: the reply's members and the stream's events, which smock's
documents decide; and 3 goldens, listed under overlap-goldens);
definitions/llm_test.mbt's 3 tests, whose subject is how a Definition
file's stopReason is read, checked and reported, and which reach the words
only through llm's check that the 4 tests pin word by word; the contract
checker's test, listed under overlap-contract-checker; and the 2 tests whose
name says documented of a helper or of a response header, which name no
vendor's words.
"""

[[reason.test]]
file = 'grpc/status_test.mbt'
name = "the seventeen status codes have gRPC's numbers and names, in order"
source = "gRPC's status codes (https://grpc.github.io/grpc/core/md_doc_statuscodes.html): the codes 0 to 16 and their names, in order"

