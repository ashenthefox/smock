[[reason]]
id = 'dependency-openssl'
rule = 'dependency'
title = "A test of what OpenSSL does, through smock's bindings"
source = """
#275, The removal rule and its proof, (C): tests of behaviour a dependency
provides, OpenSSL among them. ADR 0001: OpenSSL is the one C library smock
binds. No mutant reaches OpenSSL's code, nor smock's C in openssl/openssl.c.
"""
search = [
  '''git grep -n -E '^(async )?test "' -- 'openssl/*_test.mbt'''',
  '''git grep -n -i -E '^(async )?test "([^"\\]|\\.)*(openssl|handshake|key update|close_notify|alert|trusts)' -- '*_test.mbt' '*_wbtest.mbt' '*.mbt.md'''',
]
found = """
The first search finds the bindings' own 13 tests; the second finds 16
tests, 5 of the bindings' among them, the e2e TLS tests whose names speak of
a handshake or a key update, and server's test of a task cancelled as its
TLS handshake ends. Listed: a test whose asserted outcome OpenSSL decides,
the bindings only passing the input in and the outcome out: a client's
verification of a chain without its intermediate, and when a server answers
a key update. Left out: the bindings' tests of what smock's own code decides
(loading and refusing a configuration and the message it gives, the ALPN
callback in openssl/openssl.c, the alert code read, close_notify read as
Closed, the self-signed certificate's names and keys, and the handshakes
with each kind of chain, whose first step is the bindings' loading), and the
e2e TLS tests, whose outcomes smock's server decides and which a removal
batch judges. Those of these tests whose subject smock's C decides are
kept under own-c.
"""

