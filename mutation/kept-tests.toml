  '''git grep -l '^// Generated by scripts/gen-protobuf-fixtures.sh' -- '*.mbt'''',
  '''the test blocks of protobuf/*_test.mbt, protobuf/*_wbtest.mbt, protobuf/README.mbt.md, definitions/*_test.mbt, definitions/*_wbtest.mbt, engine/*_test.mbt and engine/*_wbtest.mbt whose code, outside strings and comments, names a value that a file the third search lists defines (each `let <name>` there, such as shop_set or greeter_set), the files themselves left out''',
  '''git grep -n -E '^(async )?test "' -- 'protobuf-conformance/*_test.mbt' 'protobuf-conformance/*_wbtest.mbt'''',
]
found = """
The third search lists the values protoc wrote: definitions and engine hold
only Descriptor sets, and protobuf holds the messages as well: 67 names, 52
of protobuf's, 12 of definitions' and 3 of engine's (it also lists
server/health_set.mbt, which no test file is). The first search finds 62
test blocks, the second 6. The fourth, the
values by name, finds 88 blocks, 34 of which the first two do not find (32
of protobuf's and 2 of definitions'), since their text says neither
fixture( nor protoc. Listed: a test whose input is a message protoc
encoded, or a Descriptor set protoc built, and whose expected value is what
protoc gives (the decoded form its text format writes, its bytes, its JSON
names, or the set read back as the .proto declares it), or the refusal of
what protoc's own parsers refuse. Left out: protobuf/README.mbt.md's 4
examples, which are documented examples, a keep reason a removal batch
derives; the tests that change every prefix or every octet of a protoc-built
