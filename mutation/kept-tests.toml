[[reason]]
id = 'backend-agreement'
rule = 'backend agreement'
title = 'A test that a seeded floating-point result is the same on every target and in a release build'
source = """
#275, The removal rule and its proof, (C): backend-agreement and
release-mode tests (engine tests of seeded floating-point results).
CONTRIBUTING.md, Build and test: prebuild.py "compiles every executable that
holds the engine with -ffp-contract=off, so that a release build on arm64
does not fuse floating-point multiply-adds and a seeded delay is the same as
on wasm-gc; CI tests the engine in a release build to check it." CI reruns
every engine test in a release build (build-test.yml's job release-test),
but only the tests below are kept for that reason.
"""
search = [
  '''git grep -n -i -E '\bfused\b|multiply-add|fp-contract|on every target' -- 'engine/*_test.mbt'''',
  '''git grep -l -E 'lognormal|example_timing|slow_hello' -- 'engine/*_test.mbt'''',
  '''git grep -n -E 'lognormal|Lognormal|@math\.(exp|ln)|\.sqrt\(' -- 'engine/*.mbt' ':!engine/*_test.mbt' ':!engine/*_wbtest.mbt'''',
]
found = """
engine/fault.mbt draws a log-normal delay or wait with exp, ln and sqrt and
the products of Marsaglia's polar method, the one floating-point computation
of a seeded result (the third search); uniform draws and Fault decisions use
whole numbers and a double compared with a probability, which no target
rounds differently.

The first search finds the fused multiply-add test and three tests that pin
draws on every target: engine/llm_timing_test.mbt's draws of seed 7, which
hold a log-normal wait, and engine/faults_test.mbt's decisions of seeds 2026
and 42, which hold none. The second finds engine/faults_test.mbt,
engine/llm_render_test.mbt and engine/llm_timing_test.mbt. Listed: the tests
of those files whose expected values hold a wait or a delay drawn through
the log-normal sampler. Left out: the tests that compare two runs on one
target, the statistical bounds of engine/faults_test.mbt's log-normal test
and its sigma 0 and median 0 (exact on every target), and the tests with
fixed waits. Also left out: the e2e tests whose Stubs draw seeded log-normal
waits (in e2e/llm_test.mbt and e2e/llm_conversation_test.mbt), which run a
debug build and which a removal batch judges, and prng's tests, which pin
its sequence on every target but are prng's own tests, whose mutants show
their worth, and none of which runs in a release build.

Checked on aarch64 on 2026-11-17: with every C compile of the engine's tests
forced to fuse multiply-adds (a compiler wrapper given as MOON_CC that adds
-ffp-contract=fast last), moon test --target native --release -p
smock/smock/engine fails the fused multiply-add test alone, 683 of 684
passing. The seeds the log-normal tests pin round to the same milliseconds
either way, so they guard the sampler's results on each target and build,
not the fusing itself.
"""

[[reason.test]]
file = 'engine/faults_test.mbt'
name = 'Fault arithmetic is never fused into multiply-adds, so a seeded delay is the same on every target'
source = "IEEE 754 rounding: 1 + 2^-30 squared rounds to 1 + 2^-29, so a * a - c is 0 unless the multiply and the subtract are fused, as CONTRIBUTING.md's sentence says an aarch64 release build would"

[[reason.test]]
file = 'engine/llm_timing_test.mbt'
name = 'each distribution is drawn from the waits generator, one wait per piece, and the draws of seed 7 are pinned on every target'
source = 'the waits seed 7 draws, a log-normal first wait among them, the same on wasm-gc, natively and in a release build'

[[reason.test]]
file = 'engine/llm_timing_test.mbt'
name = 'adding timing changes no id, no Fault decision, no pick and no helper output'
source = "the sum of each request's waits under the spec's example timing, with its log-normal first wait, the same on wasm-gc, natively and in a release build"

[[reason.test]]
file = 'engine/llm_timing_test.mbt'
name = "render shows each event with the wait that the first request of the Stub's seed gets"
source = "the waits of the first request of a Stub's seed under the spec's example timing, with its log-normal first wait, the same on wasm-gc, natively and in a release build"

[[reason.test]]
file = 'engine/llm_render_test.mbt'
name = "render shows a streamed sample's events, each with its wait, with the ids and the waits the given seed fixes and the rendering's time as created"
source = 'the waits seed 7 gives a rendering, with its log-normal first wait, the same on wasm-gc, natively and in a release build'

[[reason.test]]
file = 'engine/llm_render_test.mbt'
name = 'the same seed renders the same ids and waits, for the stream and the JSON body alike, and another seed renders others'
source = 'the waits seeds 7 and 8 give a rendering, with their log-normal first waits, the same on wasm-gc, natively and in a release build'

