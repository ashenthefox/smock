[[reason]]
id = 'own-c'
rule = "smock's own C"
title = "A test of what smock's own C decides, which no MoonBit mutant reaches"
source = """
#351: the maintainer's decision of 2026-11-17 adds this reason to #275's
removal rule (C): the tests of smock's own C, the OpenSSL glue in
openssl/openssl.c and the reset helper in server/reset.c. ADR 0001: these
are smock's only C sources, and scripts/check-no-c.sh allows no other. The
mutation runner makes mutants of MoonBit alone: its site finder reads .mbt
files (scripts/mutation/sites.py), and it skips the sites of FFI (#275, Step
2; CONTRIBUTING.md, Mutation runner). So no mutant reaches this C, and under
rule (A) alone a test of it may look redundant. A test of what OpenSSL
decides is under dependency-openssl instead, and one of what a MoonBit
mutant reaches is judged by rule (A).
"""
search = [
  '''git ls-files '*.c' '*.h'''',
  '''git grep -n -E 'extern "C"' -- '*.mbt'''',
  '''git grep -n -E '^(async )?test "' -- 'openssl/*_test.mbt'''',
  '''git grep -n -i -E '^(async )?test "([^"\\]|\\.)*(alpn|no_application_protocol|alert|close_notify|self-signed|IP address|an RST|connection resets?|valid from)' -- '*_test.mbt' '*_wbtest.mbt' '*.mbt.md'''',
  '''the test blocks of e2e/*_test.mbt and server/*_wbtest.mbt whose text matches an RST|is_reset|alpn_offer|alert_received|alpn_protocol|presented_certificate|s_client|SelfSigned''',
]
found = """
The first search finds smock's two C files; the second, the 27 bindings
that call into them, in openssl/openssl.mbt, openssl/client.mbt and
server/reset.mbt. With the C's own comments, they show what the C decides
beyond handing a call to OpenSSL: how a PEM read ends (no block, a block
that does not parse, with the earliest reason on OpenSSL's error queue, or
a key of another certificate); the chain sent after the leaf; the protocol
ALPN picks, h2 left out over a TLS 1.2 suite that RFC 9113 prohibits, and
the fatal alert when none fits; the last alert a client read; close_notify
read as the end; the self-signed certificate's names, each an IP address or
a DNS name, its validity from an hour before, and a new key and serial
number for each; and the RST that SO_LINGER makes a reset Fault send. The
third search finds the bindings' 13 tests; the fourth, 21 tests whose names
speak of ALPN, an alert, close_notify, a self-signed certificate, IP
addresses, an RST or a connection reset; the fifth, 23 e2e test blocks that
look at a reset, at what ALPN picked, at an alert, at the certificate smock
presents or at what s_client saw. 40 tests in all.

Listed: a test whose subject, as its name says, is an outcome that smock's
C decides, so that a change to that C fails it while no mutant does. Left
out: the bindings' tests of what OpenSSL decides, a leaf sent without its
intermediate and a key update, which are under dependency-openssl; their
tests of what their MoonBit decides, the messages of a refused
configuration and the names a self-signed certificate refuses; and the
ECDSA chain's handshake, which runs the RSA chain's C and differs only in
what OpenSSL does with the key. Also left out: the e2e tests that use a
reset, ALPN or the self-signed certificate to see what smock's MoonBit
decides (the 100 Continue before a Fault, the seeded draws of a reset
Fault, the Journal entry committed before the RST, the Scenario each reset
moves, the log lines of a Fault, the --tls-http2 setting, the server's
choice of protocol after ALPN, SNI, the set of names in the certificate,
its reloads and its expiry metric); and the tests of Definition files'
hosts and of HTTP/2's drain, which reach no C. No test checks the C's other
settings: TLS 1.2 at least, no renegotiation, and no session cache on a
server.

Compared with the tests a separate reviewer expected under this reason (12
of the bindings' 13; in e2e, the RST, both ALPN tests of tls_test.mbt,
tls_http2_test.mbt's TLS 1.2 suites, grpc_detection_test.mbt's h2 alone
refused with --tls-http2 off, self_signed_test.mbt's validity, its two tests
of IP or DNS names and its fingerprint; and maybe its certificate in memory
and certificates_test.mbt's two refusals whose reasons smock's C reads),
two tests are added and the others stay out:
- Added: self_signed_test.mbt's log entry at startup. Its fingerprint is
  the C's SHA-256 digest (smock_openssl_self_signed_sha256), compared with
  what openssl x509 -fingerprint -sha256 reads from the certificate smock
  presents. It is the only test of that value: the bindings' test checks
  only its shape and that two certificates differ.
- Added: self_signed_test.mbt's certificate and key held in memory. The C
  generates both and hands them over as bytes, so a change to the C that
  wrote them to a file fails this test while no mutant can, and no row of
  the use-case ledger names it, so no keep reason a removal batch derives
  holds it.
- Out: the ECDSA chain's handshake. smock_openssl_ctx_use_chain and
  smock_openssl_ctx_use_key have no branch on the key's type
  (PEM_read_bio_PrivateKey reads either), so the listed RSA handshake runs
  the same C.
- Out: the leaf sent without its intermediate and the key update, whose
  outcomes OpenSSL decides: they are kept under dependency-openssl.
- Out: the message of a refused configuration. Its three cases are among
  those the listed test of refusals with their reasons asserts, and its
  subject, the text, is TlsError::message's, in MoonBit.
- Out: the --tls-http2 tests of tls_test.mbt and grpc_detection_test.mbt.
  Their subject is the list of protocols the MoonBit hands the C, and the
  C's part, a client that offers only h2 refused, is asserted by the listed
  ALPN tests.
- Out: self_signed_test.mbt's default names, localhost, 127.0.0.1 and ::1.
  Its subject is the names the MoonBit chooses; add_name's IP or DNS names,
  IPv6 included, are asserted by the listed tests of the bindings and of
  every Mock Host.
- Out: certificates_test.mbt's pair refused at a rotation and at startup.
  Their subject is what smock does with a pair it cannot use, and the
  reasons the C reads are asserted by the bindings' listed test.
"""

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'a client that trusts only the root CA completes a handshake with a server presenting an RSA leaf and its intermediate'
source = "smock_openssl_ctx_use_chain adds each certificate after the leaf to the chain the server sends, so a client that trusts only the root CA verifies the leaf through its intermediate (ServerConfig's documentation: the certificates that issued the leaf are sent with it; RFC 5280, section 6)"

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'a configuration that cannot be used is refused with the reason'
source = "smock_openssl_ctx_use_chain and smock_openssl_ctx_use_key tell a block that does not parse, with the earliest reason on OpenSSL's error queue (smock_openssl_take_error), from a key of another certificate (their -2, or smock_openssl_ctx_check_key); the reasons are OpenSSL's, such as bad base64 decode, and the bindings' TlsError"

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'ALPN: a server accepting http/1.1 picks it from h2 and http/1.1, serves a client without ALPN, and refuses a client offering only h2'
source = "smock_alpn_select picks the first protocol of the server's list that the client offers, and fails the handshake when it offers none of them (RFC 7301, section 3.2; ServerConfig's documentation); a client without ALPN never reaches it"

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'a client that a server refuses by ALPN learns the alert the server sent by its code, 120 for no_application_protocol, whatever text OpenSSL has for it'
source = 'smock_keep_alert keeps the last alert a client connection reads, and smock_openssl_ssl_alert gives its description: 120, no_application_protocol (RFC 8446, section 6), once smock_alpn_select has refused'

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'ALPN skips h2 over a TLS 1.2 suite that RFC 9113 prohibits, anything but ECDHE or DHE with an AEAD cipher, and not over TLS 1.3'
source = 'smock_suite_allows_h2: over TLS 1.2, h2 only with ECDHE or DHE and an AEAD cipher, and over TLS 1.3 with any suite (RFC 9113, section 9.2.2 and Appendix A; docs/http2.md, TLS 1.2)'

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'a close_notify from the peer reads as Closed'
source = "smock_result reads OpenSSL's SSL_ERROR_ZERO_RETURN as -2, the end of the connection, which the bindings give as Closed, and smock_openssl_ssl_shutdown writes the close_notify (RFC 8446, section 6.1)"

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'a generated self-signed certificate serves TLS, and a client that trusts it verifies it for each of its names, IP addresses included, and for no other name'
source = "add_name makes a name that OpenSSL reads as an IPv4 or IPv6 address an IP address name and every other name a DNS name, so a client verifies the certificate for each name and no other (SelfSigned::generate's documentation)"

[[reason.test]]
file = 'openssl/openssl_test.mbt'
name = 'each generated certificate has a new key and its own SHA-256 fingerprint'
source = "smock_openssl_self_signed_new makes a new key and a random serial number for each certificate, and smock_openssl_self_signed_sha256 gives its SHA-256 digest, 32 octets (SelfSigned's documentation: no two share a fingerprint)"

[[reason.test]]
file = 'e2e/faults_test.mbt'
name = 'a reset Fault reads the whole request, body included, then ends the connection with an RST, without a byte of response'
source = 'smock_reset_on_close sets SO_LINGER with a zero timeout, so that closing the connection sends an RST, on the plain and the TLS port (docs/definition-files/faults.md: smock resets the connection, an RST, without writing anything; ADR 0001)'

[[reason.test]]
file = 'e2e/tls_test.mbt'
name = 'ALPN: a client offering h2 and http/1.1, or h2 alone, gets h2 and is served over HTTP/2; one offering http/1.1 alone, or no ALPN, gets HTTP/1.1; one offering neither fails the handshake'
source = 'smock_alpn_select on the TLS port, which offers h2, then http/1.1 (docs/http2.md, h2 on the TLS port: a client that offers neither fails the handshake, with the no_application_protocol alert)'

[[reason.test]]
file = 'e2e/tls_http2_test.mbt'
name = 'over TLS 1.2, ALPN skips h2 when the suite is one RFC 9113 prohibits: with only a CBC suite, h2 and http/1.1 get http/1.1 and h2 alone fails; the mandatory ECDHE-RSA-AES128-GCM-SHA256 with P-256 gets h2'
source = 'smock_suite_allows_h2 in the binary, against openssl s_client (docs/http2.md, TLS 1.2; RFC 9113, section 9.2.2 and Appendix A)'

[[reason.test]]
file = 'e2e/self_signed_test.mbt'
name = 'with neither certificate setting, smock serves HTTPS on the TLS port with a self-signed certificate it generated, valid from an hour before it was generated until 365 days after'
source = 'smock_openssl_self_signed_new signs the certificate with its own subject as issuer, and sets its notBefore an hour back (docs/running.md, The self-signed certificate: valid from an hour before smock generates it until 365 days after)'

[[reason.test]]
file = 'e2e/self_signed_test.mbt'
name = 'the certificate also covers every Mock Host, IP addresses as IP addresses and the rest as DNS names, so a client that trusts it can call each Mock by its Host'
source = 'add_name in smock_openssl_self_signed_new (docs/running.md, The self-signed certificate: Hosts that are IP addresses are IP address names, the others DNS names)'

[[reason.test]]
file = 'e2e/self_signed_test.mbt'
name = 'a log entry at startup says that a self-signed certificate is in use, with its SHA-256 fingerprint and its names'
source = "smock_openssl_self_signed_sha256 gives the certificate's SHA-256 digest, which the log entry carries and openssl x509 -fingerprint -sha256 gives from the certificate presented (docs/running.md, The self-signed certificate: a log entry at startup gives its SHA-256 fingerprint and its names; check its fingerprint against the log with openssl x509 -in smock.pem -noout -fingerprint -sha256)"

[[reason.test]]
file = 'e2e/self_signed_test.mbt'
name = 'the generated certificate and its key stay in memory: smock serves HTTPS with them from an empty read-only directory as its working directory, HOME and TMPDIR, which stays empty'
source = 'smock_openssl_self_signed_new generates the key and the certificate and gives them as bytes, which the bindings load from memory (docs/running.md, The self-signed certificate: both are generated with OpenSSL and held only in memory; nothing is written to disk)'
