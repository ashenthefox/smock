# The keep list of the test review (#275): the tests that removal rule (C)
# keeps for a reason that the kill matrix cannot see. Under rule (A) alone,
# such a test may kill no mutant that another test does not kill as well,
# and so look redundant: it pins a value that a spec fixes, checks that the
# targets and builds agree, checks what a dependency does, is one of the
# deliberate overlaps, or checks what smock's own C decides. A removal
# batch starts from this list, and never proposes a test on it.
#
# Each reason says where it comes from, the searches that found its tests,
# and how their hits were judged, so that the searches can be reviewed as
# well as the names. A test is named by its file and by its name as the
# file writes it between the quotes, escapes included, which is how moon's
# test metadata names it. A change that renames, moves or removes a listed
# test changes this list in the same commit: scripts/check-kept-tests.py,
# in CI's job scripts, fails when a listed test is no longer there. Its
# docstring describes this format.
#
# The searches were run at the commit that wrote this list. A change that
# adds a test for one of these reasons adds it here.

# The keep reasons of rule (C) that are not listed here: a removal batch
# derives them, from the ledgers and the trace links (#352, #353, #355).
[derived]
reasons = [
  'the only test of a feature, of an acceptance criterion, of a rule of an ADR or of a documented limit: from the boundary and use-case ledgers and the trace links',
  "the only test that gets an Admin API reply of some endpoint and status, which the contract checker then checks: from the endpoints and statuses that each e2e test's run alone records (#355)",
  'the only regression test of a closed bug: from the trace links',
  'the only e2e test of a feature a user sees: from the use-case ledger and the trace links',
  'a documented example that nothing else runs: from the use-case ledger',
]

