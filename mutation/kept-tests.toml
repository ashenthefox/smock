[[reason]]
id = 'dependency-moonhttp'
rule = 'dependency'
title = "A test of a rule or a bound that moonhttp's HTTP/2 connection enforces"
source = """
#275, The removal rule and its proof, (C): the HTTP/2 rules of ADR 0005, and
tests of behaviour a dependency provides. ADR 0005, Consequences, Tests from
outside: the e2e tests "check the limits and rules moonhttp enforces as well
as smock's own, so an upgrade that drops one fails them."
server/http2_defences.mbt, H2Connection::flooded: "smock keeps no count of
its own for the bound: the e2e tests check moonhttp's from outside, so that
an upgrade that drops it fails them." No mutant reaches moonhttp's code, so
the kill matrix cannot see these checks.
"""
search = [
  '''git grep -n -i -E '^(async )?test "([^"\\]|\\.)*moonhttp' -- '*_test.mbt' '*_wbtest.mbt' '*.mbt.md'''',
  '''git grep -n -E '^(async )?test "([^"\\]|\\.)*(COMPRESSION_ERROR|PROTOCOL_ERROR|FRAME_SIZE_ERROR|REFUSED_STREAM|ENHANCE_YOUR_CALM|FLOW_CONTROL_ERROR|STREAM_CLOSED)' -- 'e2e/*_test.mbt'''',
  '''the test blocks of e2e/*_test.mbt and server/*_wbtest.mbt whose text matches moonhttp|twice --header-size-limit|COMPRESSION_ERROR''',
  '''git grep -n -E 'Conn|moonhttp' -- 'server/http2*.mbt'''',
]
found = """
The first search finds 11 tests, the second 24, the third 20 test blocks;
the fourth shows which answers are moonhttp's. smock sends some HTTP/2
errors itself: GOAWAY PROTOCOL_ERROR for a stream ID used again
(H2Connection::judge), GOAWAY FRAME_SIZE_ERROR for a frame larger than it
advertises (FrameReader), RST_STREAM PROTOCOL_ERROR after its own 400, and
GOAWAY ENHANCE_YOUR_CALM for its own defences. Everything else of RFC 9113
and RFC 7541 is enforced by moonhttp's Conn: the field rules, stream states
and flow control errors, HPACK decoding, and its bounds on a decoded header
list and on a header block as received, twice --header-size-limit.
REFUSED_STREAM past --http2-max-concurrent-streams is moonhttp's answer
too: moonhttp 0.14.0 refuses such a stream at open, before it reports the
stream to smock, since smock advertises the limit (server/http2.mbt, the
Request event, and H2Connection::refused_at_open). smock's own check of the
limit is a backstop that never fires while moonhttp enforces it, so its
mutants survive and show nothing. The e2e tests of the concurrency bound
rest on the documented limit, a keep reason a removal batch derives, and on
the listed test of the streams moonhttp refuses at open.

Listed: a test whose subject is a rule or a bound that moonhttp enforces,
which it sends something to break or pass and whose moonhttp answer it
asserts, or a test whose moonhttp answer no other listed test asserts. Left
out: the tests of smock's own errors above, whose worth server mutants show;
the tests that name moonhttp but assert only what smock does: its cap on
SETTINGS_HEADER_TABLE_SIZE, its own 431 for a header list past moonhttp's
wrapped count, the SETTINGS it advertises, its mockoon log lines for refused
streams, and how it decodes moonhttp's fields
(server/decoded_fields_wbtest.mbt); and the tests whose subject is what
smock does after moonhttp's answer, when a listed test asserts that answer:
- e2e/http2_streams_test.mbt's delayed stream and
  e2e/http2_events_test.mbt's event stream, reset for a WINDOW_UPDATE of 0:
  their subject is that the task ends at once, as the entry's duration
  shows; RST_STREAM PROTOCOL_ERROR for that frame, on a delayed and on an
  event stream, is asserted by the listed MadeYouReset test of the five
  kinds;
- e2e/http2_bodies_test.mbt's content-length over --body-limit: its
  subject is smock's 413; RST_STREAM PROTOCOL_ERROR for HEADERS that end
  the stream with a content-length is asserted by the listed tests of
  e2e/http2_checks_test.mbt (content-length: 5) and
  e2e/http2_stream_ids_test.mbt. Its content-length of 2^32, which moonhttp
  reads as 0, gets smock's own 413, as e2e/http2_hpack_test.mbt's case of
  that kind, left out above;
- e2e/http2_rapid_reset_test.mbt's MadeYouReset past the bound, judged by
  the same test: its subject is smock's bound on early resets
  (H2Connection::reset_early in server/http2_defences.mbt, 100 streams and
  more than half), whose mutants show its worth; the five kinds of reset it
  counts are moonhttp's answers, which the listed MadeYouReset test of the
  five kinds asserts, each with its error code;
- e2e/http2_connect_test.mbt's CONNECT that reaches its Stub, judged by the
  same test: its subject is smock's handling of a CONNECT; its one moonhttp
  answer, RST_STREAM PROTOCOL_ERROR for a CONNECT whose HEADERS end the
  stream with content-length: 5, is no path of moonhttp's own: moonhttp
  checks a declared content-length against what the stream carried in
  Conn::ended, the same for every method (its http2/receive.mbt), and its
  field rules for a CONNECT check only :scheme, :path and :authority (its
  http2/fields.mbt), so the listed test of e2e/http2_checks_test.mbt's
  content-length: 5 asserts that answer.
"""

[[reason.test]]
file = 'e2e/http2_checks_test.mbt'
name = 'h2c: a stream refused with 400 counts as rejected traffic, with mock=\"\" and stub=\"\", and is not journaled, while a stream moonhttp resets, such as HEADERS that end the stream with content-length: 5, has no status, no Journal entry, no Scenario move and no metric'
source = 'RFC 9113, section 8.1.1: HEADERS that end the stream with content-length: 5 make a malformed request, which moonhttp resets, so it gets no status, no Journal entry and no metric'

[[reason.test]]
file = 'e2e/http2_checks_test.mbt'
name = "h2c: a stream that breaks one of RFC 9113's field rules h2spec does not test is reset with PROTOCOL_ERROR by moonhttp, while another stream on the connection is answered"
source = 'RFC 9113, section 8.2: the field rules h2spec does not test, which moonhttp enforces with a stream error, PROTOCOL_ERROR'

[[reason.test]]
file = 'e2e/http2_continuation_test.mbt'
name = "h2c: a header block that passes moonhttp's bound as received, twice --header-size-limit, with large CONTINUATION frames gets GOAWAY ENHANCE_YOUR_CALM and one log line naming a CONTINUATION flood, while a block at the bound is taken, padding and priority aside; a fresh connection is served"
source = "ADR 0005 and server/http2_defences.mbt: moonhttp's bound on a header block as received, twice --header-size-limit, ends the connection with GOAWAY ENHANCE_YOUR_CALM"

[[reason.test]]
file = 'e2e/http2_header_limits_test.mbt'
name = "h2c: a decoded header list over twice --header-size-limit, moonhttp's bound, gets RST_STREAM ENHANCE_YOUR_CALM from moonhttp, with no status, no Journal entry and no metric, while one at the bound gets 431 and a concurrent stream is answered"
source = "ADR 0005: moonhttp's bound on a decoded header list, twice --header-size-limit, resets the stream with ENHANCE_YOUR_CALM"

[[reason.test]]
file = 'e2e/http2_header_limits_test.mbt'
name = 'h2c: a header block over twice --header-size-limit as received gets GOAWAY ENHANCE_YOUR_CALM, which ends every stream of the connection, smock logs it as a CONTINUATION flood, even when its HEADERS frame alone passes the bound, and a fresh connection is served'
source = "ADR 0005 and server/http2_defences.mbt: moonhttp's bound on a header block as received, twice --header-size-limit, ends the connection with GOAWAY ENHANCE_YOUR_CALM"

[[reason.test]]
file = 'e2e/http2_hpack_test.mbt'
name = 'h2c: an HPACK bomb, a block that names a large table entry over and over, gets 431 while its decoded list is within twice --header-size-limit, else RST_STREAM ENHANCE_YOUR_CALM with no status, too many fields named over and over get 431, and the connection goes on'
source = "ADR 0005: moonhttp's bound on a decoded header list, twice --header-size-limit, resets an HPACK bomb's stream with ENHANCE_YOUR_CALM"

[[reason.test]]
file = 'e2e/http2_hpack_test.mbt'
name = "h2c: a header block that does not decode, with a Huffman code with EOS or bad padding, an index that names no entry, or a table size update past 4,096 octets, the size of smock's decoding table, gets GOAWAY COMPRESSION_ERROR, and a fresh connection is served; the table keeps an entry of 4,096 octets and not one larger"
source = "RFC 7541, sections 2.3.3, 5.2 and 6.3, and RFC 9113, section 4.3: a header block that does not decode is a connection error, COMPRESSION_ERROR, which moonhttp's decoder raises; a table size update past the limit is a decoding error (RFC 7541, section 6.3: 'A value that exceeds this limit MUST be treated as a decoding error'), the limit within which the encoder must stay (section 4.2)"

[[reason.test]]
file = 'e2e/http2_rapid_reset_test.mbt'
name = "h2c: streams that moonhttp refuses at open count toward the bound: 101 with an upper-case field name get GOAWAY ENHANCE_YOUR_CALM; REFUSED_STREAM past the concurrent-streams limit counts only once the client has acknowledged smock's SETTINGS"
source = 'RFC 9113, sections 8.2.1 and 5.1.2: moonhttp refuses at open a stream with an upper-case field name, and one past the concurrent-streams limit'

[[reason.test]]
file = 'e2e/http2_rapid_reset_test.mbt'
name = 'h2c: MadeYouReset: delayed and event streams whose requests have ended, reset by moonhttp for a WINDOW_UPDATE of 0, a window overflow, DATA or HEADERS after END_STREAM, or PRIORITY on the stream itself, end their tasks at once; the connection goes on, and a fresh connection is served at once'
source = 'RFC 9113, sections 6.9, 6.9.1 and 5.1, and RFC 7540, section 5.3.1: moonhttp resets a stream for a WINDOW_UPDATE of 0, a window overflow, DATA or HEADERS after END_STREAM, and a PRIORITY that makes it depend on itself'

[[reason.test]]
file = 'e2e/http2_stream_ids_test.mbt'
name = 'h2c: HEADERS on a stream that moonhttp refused at open, or reset after its HEADERS, for a field rule are ignored, and the connection serves the next stream'
source = 'RFC 9113, section 8.2: moonhttp refuses at open, or resets after its HEADERS, a stream that breaks a field rule'

