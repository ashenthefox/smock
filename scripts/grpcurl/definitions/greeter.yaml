# The example of the gRPC guide's quick start (docs/grpc.md), which
# scripts/check-grpcurl.sh serves to grpcurl. Its set, files/greeter.binpb,
# is fixtures/protobuf/details/details.binpb, which
# scripts/gen-protobuf-fixtures.sh copies here: gRPC's helloworld.proto and
# googleapis' error_details.proto, whose ErrorInfo the second Stub sends.
mocks:
  - name: greeter
    hosts: [greeter.svc]
    grpc:
      descriptorSet: greeter.binpb
      reflection: true
      health: true
stubs:
  - id: hello-tom
    mock: greeter
    request:
      path: /helloworld.Greeter/SayHello
      headers: { x-tenant: acme }
      body: { json: { name: Tom } }
    response:
      headers: { x-served-by: smock }
      json: { message: Hello Tom }
  - id: hello-unknown
    mock: greeter
    request:
      path: /helloworld.Greeter/SayHello
    response:
      template: true
      grpc:
        status: NOT_FOUND
        message: no user called ${body.name}
        trailers: { x-trace: abc }
        details:
          - "@type": type.googleapis.com/google.rpc.ErrorInfo
            reason: USER_UNKNOWN
            domain: greeter.svc
