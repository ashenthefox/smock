# The example of the gRPC guide's quick start (docs/grpc.md), as the guide
# shows it, which scripts/check-grpcurl.sh serves to grpcurl. Its set,
# files/greeter.binpb, is fixtures/protobuf/details/details.binpb, which
# scripts/gen-protobuf-fixtures.sh copies here: gRPC's helloworld.proto and
# googleapis' error_details.proto, whose ErrorInfo the second Stub sends.
mocks:
  - name: greeter
    hosts: [greeter.svc]
    grpc:
      descriptorSet: greeter.binpb   # in the body-file subdirectory, like a bodyFile
      reflection: true               # off unless turned on
      health: true                   # off unless turned on
stubs:
  - id: hello-tom
    mock: greeter
    request:
      path: /helloworld.Greeter/SayHello      # names a unary method of the set
      headers: { x-tenant: acme }             # metadata, as headers
      body: { json: { name: Tom } }           # the message as ProtoJSON
    response:
      headers: { x-served-by: smock }         # initial metadata
      json: { message: Hello Tom }            # encoded with the output type
  - id: hello-unknown
    mock: greeter
    request:
      path: /helloworld.Greeter/SayHello
    response:
      template: true
      grpc:
        status: NOT_FOUND
        message: no user called ${body.name}
        trailers: { x-trace: abc }
        details:
          - "@type": type.googleapis.com/google.rpc.ErrorInfo   # a type of the set
            reason: USER_UNKNOWN
            domain: greeter.svc
