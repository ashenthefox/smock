reviewer = ""

[[exclusion]]
mutant = "cookies/cookies.mbt,value_end,ROR,>,>=,0"
text = "f64a9a3d322d81fd"
category = "EQUIVALENT"
reason = "With `end >= start`, the loop also tests `field[start - 1]` once `end` is back at `start`. value_end takes a `start` as `find` gives it (its documentation), the index just after a cookie's `=`, and both of its callers keep to that: engine's has_cookie passes find's result, and parse `equals + 1`. So `field[start - 1]` is that `=`, which is no space or tab, and the loop stops at `start` either way, for every request. Only a call outside that contract tells them apart, such as value_end(\"  \", 0), which then reads before the field."
compiler_output = "differs"
adversarial = { context = "#328's adversarial step, 2026-11-20: a separate agent context that wrote none of #328's tests or entries", tests = ["value_end of the start find gives, and the repeat search from its end as engine's has_cookie makes it: a= (2), \"a= \" (2), \"a=  ;b=1\" (2), = for the empty name (1), \" = \" (2), a= and a tab (2), \"a= x ;\" (4), a=x (3), \"b=1; a= \" with a tab and a space (7)", "passed with the mutant applied by hand, on wasm-gc; outside the contract the mutant differs, as the reason says: value_end(\" \", 1) gives 0 instead of 1, and value_end(\"  \", 0) stops on an access out of bounds instead of giving 0, but find never gives such a start"] }
reviewer = ""

[[exclusion]]
mutant = "metrics/metrics.mbt,CounterSeries::advance_to,ROR,>,>=,0"
text = "cd3b42a1a4399734"
category = "EQUIVALENT"
reason = "With `>=`, a total equal to the counter's value is written over it. Two doubles that compare equal are the same number, but for 0 and -0, so the only change is that a counter at 0 given -0 holds -0 instead of 0. render, the one reader of the value, writes -0 as 0 (Double::to_string, whose documentation gives (-0.0).to_string() as \"0\"), and later calls compare and add -0 as they do 0, but for the sign of a zero result. So no sequence of calls renders differently."
compiler_output = "differs"
adversarial = { context = "#328's adversarial step, 2026-11-20: a separate agent context that wrote none of #328's tests or entries", tests = ["render after counters given -0: advance_to(-0) alone, with labels and then inc(by=-0), then inc(by=0), between advance_to(-1) and advance_to(0), and after inc(by=-0) and advance_to(NaN): each sample renders 0", "advance_to(+Inf) twice and inc(by=+Inf): +Inf", "passed with the mutant applied by hand, on wasm-gc; (-0.0).to_string() is \"0\" on wasm-gc and natively, checked with moonc v0.10.20"] }
reviewer = ""

