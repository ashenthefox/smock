[[exclusion]]
mutant = "cookies/cookies.mbt,find,ROR,<=,<,0"
text = "65e5a474b5c21c7d"
category = "EQUIVALENT"
reason = "With `start < field.length()`, the search stops one turn earlier, when `start` is the field's length. That turn reads the empty part after a last `;` (or an empty field, or a `from` given as the length), which has no `=`: equals_at gives -1 and the turn finds nothing, so both return -1. A `start` past the length runs no turn in either, and a negative one reads before the field in both."
compiler_output = "differs"
adversarial = { context = "#328's adversarial step, 2026-11-20: a separate agent context that wrote none of #328's tests or entries", tests = ["find at the end of a field: \"\" for \"\" and for a, \";\" for \"\", \"a=1;\" for \"\", a and b, \"a=1\" for a from 3 and from 9, \"a=1;\" for a from 4, \"a=1; \" for \"\", \"a=1;=2\" for \"\" (5), \"=1\" and \"=\" for \"\" (1), \"a=1;a=\" for a from 3 (6)", "passed with the mutant applied by hand, on wasm-gc: the turn at the field's length reads an empty part, whose -1 for `=` is no name's length"] }
reviewer = ""

[[exclusion]]
mutant = "cookies/cookies.mbt,parse,ROR,<=,<,0"
text = "ff5631d478b787a8"
category = "EQUIVALENT"
reason = "With `start < field.length()`, the loop over a field's parts stops one turn earlier, when `start` is the field's length. That turn reads the empty part after a last `;`, or an empty field, which has no `=`, so it adds no cookie: every request gives the same cookies."
