[[exclusion]]
mutant = "grpc/metadata.mbt,unpadded_base64,INT,0,1,0"
text = "4043f93d42d43430"
category = "EQUIVALENT"
reason = "`while end > 0 && value[end - 1] == '='` becomes `end > 1`. The loops differ only when `end` reaches 1 with `value[0]` an `=`, that is for a value of `=` alone. The code then gives `None`: `end` is 0, so for 1 to 3 `=` the length is no multiple of 4, and for 4 or more the padding is longer than 2. The mutant gives `None` too, since it keeps `value[0]`, an `=`, among the characters it checks against base64's alphabet. Every other value takes the same steps."
