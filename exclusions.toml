# #328's batch (cookies and metrics; the survivors of the first weekly
# run, 44423781036, that no test can kill): mutants that no input can tell
# from the code, and the fill value of an empty array. The compiler's
# output differs for each. `adversarial` records the route's second step,
# a separate agent context that wrote none of these entries and tried to
# kill each mutant from the documents; it killed the batch's one entry in
# usage (cpu_seconds,INT,1,2,0), which is gone. cookies is reached through
# its importers' tests (engine's and template's).

[[exclusion]]
mutant = "cookies/cookies.mbt,is_field,ROR,>=,>,0"
text = "64f80cc3fa3406ad"
category = "EQUIVALENT"
reason = "With `c > 'A'`, `A` itself stays `A` instead of becoming `a`; every other character is mapped as before. Neither `A` nor `a` is a letter of \"cookie\", so a name with `A` at any place differs from \"cookie\" at that place either way, and is not a Cookie field: no name tells the two apart."
compiler_output = "differs"
adversarial = { context = "#328's adversarial step, 2026-11-20: a separate agent context that wrote none of #328's tests or entries", tests = ["is_field of every name that differs from \"cookie\" in one place, at each of the six places, by each code unit from 0 to 127 and U+00C0, U+00C1, U+00DA, U+0130, U+212A, U+FF21, U+FF3A: true only where the unit is that letter in either case (\"Cookie, in any case\")", "is_field of COOKIE, Cookie, CoOkIe, cookie (true) and AOOKIE, ZOOKIE, cookiA, cookiZ, cookia, cookiz, Aookie, Zookie, AAAAAA, ZZZZZZ, the empty name, cookies, Cooki (false)", "both passed with the mutant applied by hand, on wasm-gc"] }
reviewer = ""

