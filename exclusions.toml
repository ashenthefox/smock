adversarial = { context = "a separate agent context of #275's step 3, on 2026-11-20, which wrote neither this entry nor any of grpc's tests", tests = ["a differential in a scratch white-box test of grpc, not committed: a copy of unpadded_base64 carrying the mutation against the real function, on every string of up to 8 characters from `A`, `=`, `/`, `!` and `,` (488,281 strings), no difference. The same harness reports a difference for a mutant that allows one `=` of padding at most", "among them values of `=` alone, 1 to 8 of them, the only values on which the two loops differ, and the documented `AA==` and `AA`; docs/grpc/metadata-and-status.md makes a value that is not base64 a problem, and both refuse each value of `=` alone"] }
