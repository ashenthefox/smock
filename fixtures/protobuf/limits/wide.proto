// Written for smock's tests of the decoder's bound on the values a message
// prints: a type, `Row`, of 60 fields without presence, so that an empty
// Row, 2 octets as an element of a Table's `rows`, prints 61 JSON values,
// each field at its default. A client may so send a small message whose
// decoded JSON holds far more values than the message has octets.
syntax = "proto3";

package wide;

service Tables {
  rpc Load (Table) returns (Loaded);
}

message Row {
  int64 f1 = 1;
  int64 f2 = 2;
  int64 f3 = 3;
  int64 f4 = 4;
  int64 f5 = 5;
  int64 f6 = 6;
  int64 f7 = 7;
  int64 f8 = 8;
  int64 f9 = 9;
  int64 f10 = 10;
  int64 f11 = 11;
  int64 f12 = 12;
  int64 f13 = 13;
  int64 f14 = 14;
  int64 f15 = 15;
  int64 f16 = 16;
  int64 f17 = 17;
  int64 f18 = 18;
  int64 f19 = 19;
  int64 f20 = 20;
  int64 f21 = 21;
  int64 f22 = 22;
  int64 f23 = 23;
  int64 f24 = 24;
  int64 f25 = 25;
  int64 f26 = 26;
  int64 f27 = 27;
  int64 f28 = 28;
  int64 f29 = 29;
  int64 f30 = 30;
  int64 f31 = 31;
  int64 f32 = 32;
  int64 f33 = 33;
  int64 f34 = 34;
  int64 f35 = 35;
  int64 f36 = 36;
  int64 f37 = 37;
  int64 f38 = 38;
  int64 f39 = 39;
  int64 f40 = 40;
  int64 f41 = 41;
  int64 f42 = 42;
  int64 f43 = 43;
  int64 f44 = 44;
  int64 f45 = 45;
  int64 f46 = 46;
  int64 f47 = 47;
  int64 f48 = 48;
  int64 f49 = 49;
  int64 f50 = 50;
  int64 f51 = 51;
  int64 f52 = 52;
  int64 f53 = 53;
  int64 f54 = 54;
  int64 f55 = 55;
  int64 f56 = 56;
  int64 f57 = 57;
  int64 f58 = 58;
  int64 f59 = 59;
  int64 f60 = 60;
}

message Table {
  repeated Row rows = 1;
  string note = 2;
}

message Loaded {}
